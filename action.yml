name: dpdp-scan
description: Find Indian personal data in a codebase and map the gaps to the DPDP Act. Uploads SARIF to code scanning.
branding:
  icon: shield
  color: orange
inputs:
  path:
    description: Directory to scan
    default: "."
  fail-on:
    description: "Fail the job on findings at or above this severity: high, medium, low, none"
    default: high
  upload-sarif:
    description: Upload results to GitHub code scanning (needs security-events write permission)
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build dpdp-scan
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund && npm run build
    - name: Scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
      # AI stays off in CI: runners have no local model, and the exit code never depends on AI.
      run: |
        node "$GITHUB_ACTION_PATH/dist/cli.js" "$SCAN_PATH" --ai off --format sarif --out dpdp-scan.sarif --fail-on none
        node "$GITHUB_ACTION_PATH/dist/cli.js" "$SCAN_PATH" --ai off --no-color --fail-on "$FAIL_ON"
    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: dpdp-scan.sarif
        category: dpdp-scan
